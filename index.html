<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>projeto refri com sucesso</title>
</head>
<body>
    
    <main>
        <div class="item " style="--background: #ea3d41">
            <div class="title">Strawberry</div>
            <img class="fruit" src="./assets/Morango-fruta.png" alt="">
             <img class="refri" src="./assets/Morango-refrigerante.png" alt="">
        </div>

        <div class="item active " style="--background: #2d5643">
            <div class="title">Avocado</div>
            <img class="fruit" src="./assets/Abacate-fruta.png" alt="">
             <img class="refri" src="./assets/Abacate-refrigerante.png" alt="">
        </div>

        <div class="item" style="--background: #e7a043">
            <div class="title">Orange</div>
            <img class="fruit" src="./assets/Laranja-fruta.png" alt="">
             <img class="refri" src="./assets/Laranja-refrigerante.png" alt="">
        </div>

        <div class="arrow">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>

    </main>

<script src="./script.js"></script>

</body>

</html>
